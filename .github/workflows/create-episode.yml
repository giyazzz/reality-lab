name: Create REALITY LAB free episode
on:
  workflow_dispatch:
    inputs:
      topic:
        description: Science topic for this episode
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install free open-source rendering and speech tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - run: npm install
      - name: Generate research draft, storyboard and narration
        env:
          TOPIC: \${{ inputs.topic }}
        run: npm run generate
      - run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: reality-lab-free-episode
          path: output/
          retention-days: 14
